<script type="application/processing">
void setup() {
    size(160, 120);
}
 
void draw() {
    int s = second()*2;       //(0 - 59)*4 = 0 - 240
    int m = minute()*2;       //Same as above
    int h = hour()*2;         //Same as above
    float deg = 180;          //Value for rotating
    float rad = radians(deg); //Value in degrees
     
    background(65);
           
    fill(255, 255, 0);
    rect(20, 0, 120, 120);  
    
    fill(237,48,60); 
    textAlign(CENTER);

    text(hour(), 10, 120-h);
    text(minute(), width/2, 118-m);
    text(second(), 150, 120-s);
    
    //Graph
    noStroke();
    translate(80, 120);
    rotate(rad);
    
    fill(20,180,80);       //Hour Block
    rect(00, 0, 60, m);
    triangle(00, m, 60, h, 60, m);   
    fill(225,129,54);      //Minute Block
    triangle(0, m, 60, h, 60, 120);
     
    fill(30,30,230); 
    triangle(0, 0, 0, m, -60, 0);
    fill(237,48,60);      //Second Block
    triangle(-60, 0, -60, s, 0, m);
}
</script>
